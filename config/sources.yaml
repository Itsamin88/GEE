  Instagram:     ["instagram.com", "instagr.am"]
  YouTube:       ["youtube.com", "youtu.be", "m.youtube.com"]
  Vimeo:         ["vimeo.com"]
  LinkedIn:      ["linkedin.com"]
  blog platform: ["wordpress.com", "blogspot.", "medium.com", "substack.com", "ghost.io",
                  "tumblr.com", "blogger.com", "over-blog.com", "canalblog.com", "wixsite.com"]
  directory listing:
    ["ecovillage.org", "gen-europe.org", "ic.org", "fic.ic.org", "numundo.org", "wwoof.",
     "workaway.info", "helpx.net", "eurotopia.de", "diggersanddreamers.org.uk",
     "permaculture.org", "permacultureglobal.org", "ecobasa.org", "gen-africa.org",
     "casacollettiva.it", "colibris-lemouvement.org", "oasis.colibris-lemouvement.org",
     "reseau-colibris.org", "ecolise.eu", "globalecovillagenetwork.org", "ecovillage.nl",
     "gen-nl.nl", "vivremieux.org", "habitatparticipatif.net"]
  crowdfunding:
    ["kickstarter.com", "gofundme.com", "ulule.com", "kisskissbankbank.com", "betterplace.org",
     "indiegogo.com", "helloasso.com", "voordekunst.nl", "crowdfunding.nl", "leetchi.com",
     "miimosa.com", "zaar.mt", "goteo.org", "verkami.com", "produzionidalbasso.com",
     "startnext.com", "wemakeit.com", "patreon.com", "opencollective.com"]
  booking or hosting:
    ["airbnb.", "booking.com", "hostelworld.com", "bookyogaretreats.com", "retreat.guru",
     "tripadvisor.", "gites.fr", "natuurhuisje.nl", "hipcamp.com", "welcometomyfarm.com"]
  news outlet:
    ["ladepeche.fr", "lemonde.fr", "francetvinfo.fr", "ouest-france.fr", "sudouest.fr",
     "reporterre.net", "nrc.nl", "volkskrant.nl", "trouw.nl", "ad.nl", "bd.nl", "omroepbrabant.nl",
     "theguardian.com", "bbc.co.uk", "elpais.com", "publico.pt", "repubblica.it"]

# --- Stage 0.2: source-set discovery query templates ------------------------
# {name} community name, {alt} alternative name, {place} locality/municipality,
# {country} country, {founder} founder name, {entity} legal entity name.
discovery_queries:
  platform_accounts:
    - '"{name}" facebook'
    - '"{name}" instagram'
    - '"{name}" youtube'
    - '"{name}" vimeo'
    - '"{name}" linkedin'
  former_domain:
    - '"{name}" formerly'
    - '"{name}" ancien site'
    - '"{name}" old website'
    - '"{name}" "was previously known as"'
  directories:
    - '"{name}" ecovillage.org'
    - '"{name}" site:ic.org'
    - '"{name}" site:numundo.org'
    - '"{name}" wwoof'
    - '"{name}" workaway'
    - '"{name}" {country} ecovillage directory'
  contact_trace:
    - '"{address}"'
    - '"{email}"'
    - '"{phone}"'
  entity:
    - '"{entity}"'
    - '"{entity}" {country} association registre'
    - '"{entity}" statuts'
  domain_guesses:
    - "{slug}.org"
    - "{slug}.com"
    - "{slug}.net"
    - "{slug}.{cc}"
    - "{slug}.eu"

# --- Stage 4: web archive ---------------------------------------------------
archive:
  cdx_endpoint: "http://web.archive.org/cdx/search/cdx"
  cdx_params:
    fl: "original,timestamp,mimetype,statuscode,digest"
    collapse: "urlkey"
    limit: 5000
    filter: "statuscode:200"
  wayback_available_endpoint: "https://archive.org/wayback/available"
  snapshot_url_template: "https://web.archive.org/web/{timestamp}id_/{url}"
  # Annual snapshot sampling for the pages that matter most for dating.
  priority_snapshot_paths: ["/", "/about", "/history", "/projects", "/land", "/restoration",
                            "/water", "/agriculture", "/farm", "/documents", "/reports"]
  timetravel_endpoint: "http://timetravel.mementoweb.org/timemap/link/"

# --- Stage 5: academic databases -------------------------------------------
# access: api = machine-readable endpoint; html = page scraping; manual = record
# as unreachable-by-automation and log the negative consultation honestly.
academic_databases:
  - {id: openalex, name: OpenAlex, access: api, endpoint: "https://api.openalex.org/works", type: academic, needs_key: false}
  - {id: crossref, name: Crossref, access: api, endpoint: "https://api.crossref.org/works", type: academic, needs_key: false}
  - {id: semantic_scholar, name: Semantic Scholar, access: api, endpoint: "https://api.semanticscholar.org/graph/v1/paper/search", type: academic, needs_key: false}
  - {id: core, name: CORE, access: api, endpoint: "https://api.core.ac.uk/v3/search/works", type: academic, needs_key: true, key_env: CORE_API_KEY}
  - {id: base, name: BASE (Bielefeld), access: api, endpoint: "https://api.base-search.net/cgi-bin/BaseHttpSearchInterface.fcgi", type: academic, needs_key: true, key_env: BASE_API_KEY}
  - {id: openaire, name: OpenAIRE, access: api, endpoint: "https://api.openaire.eu/search/publications", type: academic, needs_key: false}
  - {id: doaj, name: DOAJ, access: api, endpoint: "https://doaj.org/api/search/articles", type: academic, needs_key: false}
  - {id: datacite, name: DataCite, access: api, endpoint: "https://api.datacite.org/dois", type: academic, needs_key: false}
  - {id: scielo, name: SciELO, access: html, endpoint: "https://search.scielo.org/", type: academic, needs_key: false}
  - {id: redalyc, name: Redalyc, access: html, endpoint: "https://www.redalyc.org/busquedaArticuloFiltros.oa", type: academic, needs_key: false}
  - {id: agris, name: AGRIS (FAO), access: html, endpoint: "https://agris.fao.org/search/en", type: academic, needs_key: false}
  - {id: oatd, name: OATD, access: html, endpoint: "https://oatd.org/oatd/search", type: thesis portal, needs_key: false}
  - {id: ndltd, name: NDLTD Global ETD Search, access: html, endpoint: "https://search.ndltd.org/search.php", type: thesis portal, needs_key: false}
  - {id: dart_europe, name: DART-Europe, access: html, endpoint: "https://www.dart-europe.org/browse-results.php", type: thesis portal, needs_key: false}
  - {id: google_scholar, name: Google Scholar, access: manual, type: academic, needs_key: false,
     note: "Blocks automated access. Recorded as unreachable rather than as zero hits."}
  - {id: researchgate, name: ResearchGate, access: manual, type: academic, needs_key: false,
     note: "Blocks automated access."}
  - {id: academia_edu, name: Academia.edu, access: manual, type: academic, needs_key: false}
  - {id: jstor, name: JSTOR, access: manual, type: academic, needs_key: false}
  - {id: proquest, name: ProQuest Dissertations, access: manual, type: thesis portal, needs_key: false}

# National thesis / repository portals, selected by community country.
national_thesis_portals:
  France:      [{id: theses_fr, name: theses.fr, access: api, endpoint: "https://theses.fr/api/v1/theses/recherche/"},
                {id: hal, name: HAL, access: api, endpoint: "https://api.archives-ouvertes.fr/search/"},
                {id: dumas, name: DUMAS, access: html, endpoint: "https://dumas.ccsd.cnrs.fr/search/index/"}]
  Netherlands: [{id: narcis_worldcat, name: NARCIS successor / OpenAIRE NL, access: api, endpoint: "https://api.openaire.eu/search/publications"},
                {id: edepot_wur, name: WUR eDepot, access: html, endpoint: "https://library.wur.nl/WebQuery/wurpubs"}]
  Portugal:    [{id: rcaap, name: RCAAP, access: html, endpoint: "https://www.rcaap.pt/results.jsp"}]
  Spain:       [{id: teseo, name: TESEO, access: manual}, {id: dialnet, name: Dialnet, access: html, endpoint: "https://dialnet.unirioja.es/buscar/documentos"}]
  Brazil:      [{id: bdtd, name: BDTD, access: html, endpoint: "https://bdtd.ibict.br/vufind/Search/Results"},
                {id: teses_usp, name: Teses USP, access: html, endpoint: "https://www.teses.usp.br/index.php"}]
  Sweden:      [{id: diva, name: DiVA, access: html, endpoint: "https://www.diva-portal.org/smash/resultList.jsf"}]
  Germany:     [{id: dnb, name: Deutsche Nationalbibliothek, access: api, endpoint: "https://services.dnb.de/sru/dnb"}]
  Italy:       [{id: iris, name: IRIS/OpenAIRE IT, access: api, endpoint: "https://api.openaire.eu/search/publications"}]
  Denmark:     [{id: dk_openaire, name: OpenAIRE DK, access: api, endpoint: "https://api.openaire.eu/search/publications"}]
  default:     [{id: openaire_country, name: OpenAIRE (country-scoped), access: api, endpoint: "https://api.openaire.eu/search/publications"}]

