# --- Stage 6: grey literature and funding databases ------------------------
grey_databases:
  - {id: cordis, name: CORDIS (EU research projects), access: api, type: grey - funding,
     endpoint: "https://cordis.europa.eu/search/results", note: "Horizon Europe, H2020, FP7"}
  - {id: life_programme, name: EU LIFE programme database, access: html, type: grey - funding,
     endpoint: "https://webgate.ec.europa.eu/life/publicWebsite/search"}
  - {id: erasmus_plus, name: Erasmus+ Project Results Platform, access: html, type: grey - funding,
     endpoint: "https://erasmus-plus.ec.europa.eu/projects/search"}
  - {id: keep_interreg, name: Keep.eu (Interreg projects), access: html, type: grey - funding,
     endpoint: "https://keep.eu/search/"}
  - {id: enrd_leader, name: European Network for Rural Development / LEADER, access: html,
     type: grey - funding, endpoint: "https://ec.europa.eu/enrd/projects-practice_en.html"}
  - {id: eu_funding_tenders, name: EU Funding & Tenders portal, access: html, type: grey - funding,
     endpoint: "https://ec.europa.eu/info/funding-tenders/opportunities/portal/screen/opportunities"}
  - {id: openaire_projects, name: OpenAIRE projects, access: api, type: grey - funding,
     endpoint: "https://api.openaire.eu/search/projects"}
  - {id: opencorporates, name: OpenCorporates, access: api, type: registry,
     endpoint: "https://api.opencorporates.com/v0.4/companies/search", needs_key: true, key_env: OPENCORPORATES_KEY}
  - {id: fr_rna_associations, name: "France — Répertoire National des Associations", access: api,
     type: registry, endpoint: "https://entreprise.data.gouv.fr/api/rna/v1/full_text/", countries: [France]}
  - {id: fr_annuaire_entreprises, name: "France — Annuaire des Entreprises", access: api,
     type: registry, endpoint: "https://recherche-entreprises.api.gouv.fr/search", countries: [France]}
  - {id: nl_kvk, name: "Netherlands — KVK open data", access: html, type: registry,
     endpoint: "https://www.kvk.nl/zoeken/", countries: [Netherlands]}
  - {id: nl_ruimtelijke_plannen, name: "Netherlands — Ruimtelijkeplannen.nl (planning)", access: html,
     type: grey - government, endpoint: "https://www.ruimtelijkeplannen.nl/", countries: [Netherlands]}
  - {id: fr_geoportail_urbanisme, name: "France — Géoportail de l'urbanisme", access: html,
     type: grey - government, endpoint: "https://www.geoportail-urbanisme.gouv.fr/", countries: [France]}
  - {id: organic_certifiers, name: Organic certification public client lists, access: html,
     type: registry, note: "Records first year of certification where shown"}
  - {id: openstreetmap_nominatim, name: OpenStreetMap Nominatim, access: api, type: registry,
     endpoint: "https://nominatim.openstreetmap.org/search", note: "Locality confirmation only. Never an area source."}

grey_literature_types:
  - masters or doctoral thesis
  - conference paper or poster
  - NGO or foundation report
  - government or municipal report
  - environmental impact assessment
  - grant application
  - grant award record
  - grant final report
  - project deliverable
  - certification audit report
  - network or federation report
  - working paper or preprint
  - consultancy or evaluation report
  - sector newsletter or bulletin
  - agricultural extension publication
  - land trust or conservation easement document
  - planning application or building permit

grey_query_templates:
  - '"{name}" filetype:pdf'
  - '"{name}" rapport filetype:pdf'
  - '"{name}" subvention'
  - '"{name}" grant'
  - '"{name}" permis'
  - '"{name}" vergunning'
  - '"{name}" bestemmingsplan'
  - '"{name}" {country} projet financé'
  - '"{entity}" subvention OR grant OR financement'
  - '"{place}" "{name}" plan'

filetype_search_extensions: [pdf, doc, docx, xls, xlsx, csv, ppt, pptx, odt, ods]

# --- Search engines (Stage 2e, 5, 6, 7) -------------------------------------
# All optional. Absence is recorded as an unreachable consultation, never as
# zero results.
search_engines:
  - {id: duckduckgo_html, name: DuckDuckGo HTML, access: html, endpoint: "https://html.duckduckgo.com/html/", needs_key: false}
  - {id: brave, name: Brave Search API, access: api, endpoint: "https://api.search.brave.com/res/v1/web/search", needs_key: true, key_env: BRAVE_API_KEY}
  - {id: serpapi, name: SerpAPI, access: api, endpoint: "https://serpapi.com/search", needs_key: true, key_env: SERPAPI_KEY}
  - {id: google_cse, name: Google Programmable Search, access: api, endpoint: "https://www.googleapis.com/customsearch/v1", needs_key: true, key_env: GOOGLE_CSE_KEY, extra_env: GOOGLE_CSE_CX}
  - {id: bing, name: Bing Web Search, access: api, endpoint: "https://api.bing.microsoft.com/v7.0/search", needs_key: true, key_env: BING_API_KEY}
  - {id: mojeek, name: Mojeek, access: html, endpoint: "https://www.mojeek.com/search", needs_key: false}
  - {id: marginalia, name: Marginalia Search, access: html, endpoint: "https://search.marginalia.nu/search", needs_key: false}

