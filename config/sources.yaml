# ============================================================================
# DISCOVERY REGISTER — where to look, in what order, and what it is worth.
# Stage numbers follow the ten-stage protocol in register v2.4 Part B.
# ============================================================================
version: "1.0.0"

# --- Stage 2a: well-known paths probed on every conventional website -------
