# --- Feed and sitemap probes ------------------------------------------------
feed_paths: ["/feed", "/feed/", "/rss", "/rss.xml", "/atom.xml", "/index.xml", "/feed/atom",
             "/blog/feed", "/news/feed", "/?feed=rss2", "/feeds/posts/default", "/rss/",
             "/blog/rss.xml"]
sitemap_paths: [/sitemap.xml, /sitemap_index.xml, /sitemap-index.xml, /sitemap.xml.gz,
                /wp-sitemap.xml, /sitemap/sitemap.xml, /sitemaps.xml, /page-sitemap.xml,
                /post-sitemap.xml]
robots_path: /robots.txt

# --- Stage 0: platform detection -------------------------------------------
