# ============================================================================
# ONSET / DATE EXTRACTION
# ============================================================================
onset:
  # Sentences that describe a deliberate environmental action. A date in the same
  # sentence is a candidate onset; a date elsewhere on the page is not.
  action_verbs:
    en: ['planted', 'sown', 'sowed', 'dug', 'excavated', 'built', 'constructed', 'created',
         'established', 'restored', 'rehabilitated', 'reforested', 'terraced', 'mulched',
         'began (planting|restoring|working|cultivating)', 'started (planting|restoring|the garden)']
    fr: ['planté', 'plantée', 'plantées', 'semé', 'creusé', 'construit', 'créé', 'créée',
         'établi', 'restauré', 'reboisé', 'aménagé', 'commencé']
    nl: ['geplant', 'gezaaid', 'gegraven', 'aangelegd', 'gebouwd', 'gecreëerd', 'hersteld',
         'begonnen', 'gestart', 'ingericht']
    de: ['gepflanzt', 'gesät', 'gegraben', 'angelegt', 'gebaut', 'geschaffen', 'renaturiert', 'begonnen']
    es: ['plantado', 'sembrado', 'excavado', 'construido', 'creado', 'restaurado', 'comenzado']
    pt: ['plantado', 'semeado', 'escavado', 'construído', 'criado', 'restaurado', 'começou']
    it: ['piantato', 'seminato', 'scavato', 'costruito', 'creato', 'ripristinato', 'iniziato']
  founding_markers:
    # Deliberately NOT a bare "since YYYY": on a community page that far more
    # often dates an activity than the founding of the entity, and a wrong
    # founding year propagates into founding_decade and the onset comparison.
    en: ['founded in', 'established in', 'was founded', 'set up in', 'formed in', 'created in',
         'the community (was )?(founded|started|began)', 'we (were )?founded']
    fr: ['fond[ée]e? en', 'cr[ée]{2}e? en', 'n[ée]e? en \d{4}', 'association cr[ée]{2}e',
         'le lieu a [ée]t[ée] cr[ée]{2}']
    nl: ['opgericht in', 'gesticht in', 'opgericht \d{4}', 'ontstaan in']
    de: ['gegr[üu]ndet (19|20)\d{2}', 'gegr[üu]ndet im Jahr', 'entstand (19|20)\d{2}']
    es: ['fundada en', 'fundado en', 'creada en', 'creado en']
    pt: ['fundada em', 'fundado em', 'criada em', 'criado em']
    it: ['fondata nel', 'fondato nel']
  land_acquisition_markers:
    en: ['bought the land', 'purchased the (land|farm|property)', 'acquired the (land|site|farm)',
         'leased the land', 'took over the farm', 'land was (bought|purchased|acquired)']
    fr: ['acheté le terrain', 'acquisition du terrain', 'acheté la ferme', 'racheté', 'bail']
    nl: ['grond gekocht', 'terrein gekocht', 'boerderij gekocht', 'aangekocht', 'in erfpacht']
    de: ['Land gekauft', 'Hof gekauft', 'erworben', 'Pachtvertrag']
    es: ['compró el terreno', 'adquirió la finca', 'arrendó']
    pt: ['comprou o terreno', 'adquiriu a quinta', 'arrendou']
  first_residence_markers:
    en: ['moved in', 'moved onto the land', 'first residents', 'began living', 'first inhabitants',
         'we settled', 'started living here']
    fr: ['installé sur le lieu', 'premiers habitants', 'emménagé', 'nous nous sommes installés']
    nl: ['ingetrokken', 'eerste bewoners', 'zijn we gaan wonen', 'gevestigd']
    de: ['eingezogen', 'erste Bewohner', 'wir zogen']
    es: ['primeros habitantes', 'nos instalamos', 'nos mudamos']
    pt: ['primeiros habitantes', 'mudámo-nos', 'instalámo-nos']
  # Domains for domain_onsets
  domains:
    water: [pc01_rainwater, pc02_swales, pc03_irrigation]
    soil: [pc04_no_till, pc05_mulching, pc06_cover_crop, pc12_organic]
    vegetation: [pc07_tree_planting, pc08_agroforestry, pc09_polyculture, pc10_hedgerows, pc11_small_parcel]
    land_cover: [pc13_restoration]

