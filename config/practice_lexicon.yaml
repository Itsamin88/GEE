# ============================================================================
# IMAGE RELEVANCE VOCABULARY
# ============================================================================
image_relevance:
  # Strong: an image whose filename/alt/caption matches these is evidence-bearing.
  strong:
    # Keep each alternation on ONE line. YAML folds a wrapped quoted scalar
    # into a space, which silently turns '|plan.?de.?masse' into
    # '| plan.?de.?masse' and stops it matching a caption that begins with it.
    - 'site.?plan|master.?plan|masterplan|plattegrond|terreinplan|inrichtingsplan'
    - 'plan.?de.?masse|lageplan|plano|bebauungsplan|plan.?director'
    - 'land.?use|landgebruik|zonage|zoning|bestemmingsplan|uso.?de.?suelo'
    - 'permaculture.?design|design.?plan|ontwerp|conception'
    - 'restoration.?map|herstelkaart|carte.?de.?restauration'
    - 'swale|keyline|terrace|terrass|baissiere|noue|greppel'
    - 'food.?forest|voedselbos|foret.?jardin|waldgarten|agrofloresta'
    - 'water.?(system|plan|map)|waterplan|wadi|plan.?d.?eau|drainage|ontwerpplan'
    - 'contour|hoogtelijn|courbe.?de.?niveau'
    - 'plantation|planting.?plan|beplantingsplan|plan.?de.?plantation|pflanzplan'
    - 'before.?(and.?)?after|avant.?apres|voor.?en.?na|vorher.?nachher'
    - 'aerial|luchtfoto|vue.?aerienne|luftbild|orthophoto'
    - 'map\b|carte\b|kaart\b|karte\b|mapa\b|mappa\b'
    - 'diagram|schema|schéma|schets|skizze'
    - 'farm.?plan|ferme|boerderijplan'
    - 'nursery|pepiniere|kwekerij'
    - 'erosion|gully|ravine'
    - 'pond|mare|vijver|teich|charca'
    - 'wetland|zone.?humide|moeras|feuchtgebiet'
  # Moderate: worth keeping if the surrounding text supports it.
  moderate:
    - 'garden|jardin|tuin|garten|huerta|horta'
    - 'orchard|verger|boomgaard|obstgarten|pomar'
    - 'field|champ|akker|feld|campo'
    - 'tree|arbre|boom|baum|arbol|arvore'
    - 'harvest|recolte|oogst|ernte|cosecha'
    - 'soil|sol|bodem|boden|suelo|solo'
    - 'compost'
    - 'greenhouse|serre|kas|gewachshaus|invernadero'
    - 'construction|chantier|bouw|obras'
    - 'volunteer|benevole|vrijwilliger'
  # Decorative: excluded unless a caption promotes them.
  decorative:
    - 'logo|icon|favicon|sprite|banner|header|footer|avatar|button|badge|arrow|bullet'
    - 'placeholder|spacer|divider|background|bg.?image|pattern'
    - 'facebook|instagram|twitter|youtube|linkedin|whatsapp|share|social'
    - 'thumb(nail)?.?\d+x\d+|-\d{2,3}x\d{2,3}\.'
    - 'portrait|headshot|team.?photo|profile.?pic'
    - 'sponsor|partner.?logo|award.?badge'
