# ============================================================================
# PRACTICE DETECTION LEXICON
# ----------------------------------------------------------------------------
# These patterns propose CANDIDATE practice evidence. They never assign a
# coding level on their own: the level comes from who said it (source class),
# how specific the statement is, and whether it recurs across years.
#
# `include` : regex fragments (case-insensitive, unicode) that mark the practice
# `specific`: fragments that raise a statement from an aspiration to a
#             specific action (a number, an area, a date, a named structure)
# `deny`    : fragments that mark an explicit denial ("we do not plough")
# `exclude` : fragments that would otherwise false-positive
# ============================================================================
version: "1.0.0"

# Denial markers, applied per language, that turn a hit into `explicitly absent`
# ONLY when they occur in the same sentence as the practice term.
denial_markers:
  en: ['\bwe do not\b', '\bwe don''t\b', '\bno longer\b', '\bnever\b', '\bwithout any\b',
       '\bwe avoid\b', '\bis not used\b', '\bare not used\b', '\bwe have never\b', '\bnot practised\b',
       '\bnot practiced\b', '\bno .{0,12} on this (site|land|farm)\b']
  fr: ['\bnous ne\b', '\bn[''’]\w+ (pas|plus|jamais)\b', '\bne\s+\w+ons\s+(pas|plus|jamais)\b',
       '\bpas de\b', '\bjamais\b', '\bsans aucun\b', '\bnous évitons\b',
       '\bn''est pas utilis', '\bne pratiquons pas\b', '\baucun\b', '\bn[''’]utilisons\b']
  nl: ['\bwij gebruiken geen\b', '\bgeen\b', '\bnooit\b', '\bzonder\b', '\bwordt niet gebruikt\b',
       '\bwij doen niet aan\b']
  de: ['\bwir verwenden kein', '\bkeine\b', '\bniemals\b', '\bohne\b', '\bwird nicht\b']
  es: ['\bno usamos\b', '\bsin\b', '\bnunca\b', '\bno se utiliza\b', '\bno practicamos\b']
  pt: ['\bnão usamos\b', '\bsem\b', '\bnunca\b', '\bnão é utilizado\b', '\bnão praticamos\b']
  it: ['\bnon usiamo\b', '\bsenza\b', '\bmai\b', '\bnon viene utilizzat']

# Fragments that make a statement SPECIFIC rather than aspirational.
specificity_markers:
  - '\b\d{4}\b'                                  # a year
  - '\b\d+([.,]\d+)?\s*(ha|hectare|hectares|hectaren|hektar|hectáreas|hectares|acres?)\b'
  - '\b\d+([.,]\d+)?\s*(m2|m²|km2|km²)\b'
  - '\b\d{2,6}\s+(trees|arbres|bomen|Bäume|árboles|árvores|alberi)\b'
  - '\b(planted|plantés|plantée|geplant|gepflanzt|plantado|piantati)\b'
  - '\b(built|constructed|dug|excavated|creusé|construit|aangelegd|gegraven|angelegt|construido)\b'
  - '\b(since|depuis|sinds|seit|desde|dal)\s+\d{4}\b'
  - '\b(between|entre|tussen|zwischen)\s+\d{4}\s*(and|et|en|und|y|e)\s*\d{4}\b'

