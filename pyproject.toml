[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "documentary-research-crawler"
version = "1.0.0"
description = "Deep documentary research system for Stage 1 coding of intentional sustainable communities"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pypdf>=4.0",
    "pillow>=10.0",
    "PyYAML>=6.0",
]

[project.scripts]
dcr = "dcr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: spawns real worker processes; minutes rather than milliseconds",
    "benchmark: measures throughput and is only meaningful on a quiet machine",
]

[tool.ruff]
line-length = 100
target-version = "py310"
